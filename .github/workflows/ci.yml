name: CI

on:
  push:
  pull_request:

jobs:
  datenbank:
    name: Datenbank-Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kombi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kombi_test

  app:
    name: App bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:ki
      - run: npm run build

  edge-function:
    name: Edge Function prüfen (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/was-essen/index.ts
