name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Supabase-Werte kommen aus der .env im Repo. Sind die Repository-Variablen
      # SUPABASE_URL/SUPABASE_KEY gesetzt, haben sie Vorrang. (Nur setzen, wenn nicht
      # leer – eine leere Umgebungsvariable würde die .env sonst überdecken.)
      - name: Supabase-Werte prüfen
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
            echo "VITE_SUPABASE_KEY=$SUPABASE_KEY" >> "$GITHUB_ENV"
          elif ! grep -Eq '^VITE_SUPABASE_URL=https://' .env 2>/dev/null \
            || grep -q 'DEIN-PROJEKT' .env \
            || ! grep -Eq '^VITE_SUPABASE_KEY=.+' .env; then
            echo "::error::Supabase-Werte fehlen: .env ausfüllen oder Repository-Variablen SUPABASE_URL und SUPABASE_KEY anlegen."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
